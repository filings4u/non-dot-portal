<style>:root{--blue:#17365f;--blue2:#24467f;--ink:#17365f;--muted:#627892;--line:#dce5ef;--soft:#f3f6fb;--orange:#f05a00;--green:#1d7a45;--red:#a63f32}*{box-sizing:border-box}html{background:var(--soft)}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.proposal-loading{padding:80px 20px;text-align:center;color:var(--muted)}.proposal-shell{min-height:100vh}.proposal-top{background:var(--blue);color:#fff}.proposal-top-inner{width:min(1120px,calc(100% - 32px));margin:auto;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}.proposal-top img{display:block;max-width:min(390px,58vw);max-height:78px}.proposal-top-actions{display:flex;gap:9px;flex-wrap:wrap}.proposal-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid #cbd8e7;border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;cursor:pointer}.proposal-btn:hover{border-color:#9fb5cd}.proposal-btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.proposal-btn.ghost{background:transparent;border-color:rgba(255,255,255,.38);color:#fff}.proposal-btn:disabled{opacity:.55;cursor:not-allowed}.proposal-wrap{width:min(1120px,calc(100% - 32px));margin:30px auto 60px}.proposal-paper{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(23,54,95,.08);overflow:hidden}.proposal-hero{padding:42px 46px 34px;background:linear-gradient(180deg,#fff 0,#f8fafd 100%)}.proposal-kicker{display:inline-block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.proposal-hero h1{margin:9px 0 10px;font-size:clamp(32px,5vw,50px);line-height:1.05;letter-spacing:-.02em}.proposal-hero>p{max-width:760px;margin:0;color:var(--muted);font-size:16px;line-height:1.7}.proposal-meta{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin-top:28px}.proposal-meta-card{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.proposal-meta-card small{display:block;margin-bottom:5px;color:#7a8da4;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.proposal-meta-card strong{display:block;font-size:14px}.proposal-meta-card span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.proposal-section{padding:32px 46px;border-top:1px solid #e8edf4}.proposal-section h2{margin:0 0 11px;font-size:25px}.proposal-section p{margin:0;white-space:pre-wrap;color:#526b87;line-height:1.75}.proposal-pricing{width:100%;border-collapse:collapse;margin-top:14px}.proposal-pricing th,.proposal-pricing td{padding:14px 12px;border-bottom:1px solid #e7edf4;text-align:left;vertical-align:top}.proposal-pricing th{background:#f7f9fc;color:#627892;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.proposal-pricing th:last-child,.proposal-pricing td:last-child{text-align:right}.proposal-pricing td small{display:block;margin-top:4px;color:#72849a;line-height:1.45}.proposal-totals{display:grid;grid-template-columns:1fr auto;gap:8px 18px;width:min(420px,100%);margin:18px 0 0 auto;padding:18px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.proposal-totals span{color:#687d95}.proposal-totals strong{font-size:16px;text-align:right}.proposal-totals .grand{padding-top:10px;border-top:1px solid var(--line);font-size:19px;color:var(--blue)}.proposal-company{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:28px 46px;border-top:1px solid #e8edf4;background:#f9fbfd}.proposal-company p{margin:0;color:#637891;font-size:12px;line-height:1.65}.proposal-company strong{display:block;margin-bottom:5px;color:var(--blue);font-size:14px}.proposal-accept{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 45px rgba(23,54,95,.06);overflow:hidden}.proposal-accept-head{padding:25px 30px;background:#17365f;color:#fff}.proposal-accept-head span{display:block;color:#ffb47d;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.proposal-accept-head h2{margin:7px 0 5px;font-size:25px}.proposal-accept-head p{margin:0;color:#dbe6f3;line-height:1.6}.proposal-form{padding:28px 30px}.proposal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.proposal-field{display:grid;gap:6px}.proposal-field.full{grid-column:1/-1}.proposal-field span{color:#536b86;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.proposal-field input,.proposal-field select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cad7e6;border-radius:9px;background:#fff;color:#17365f;outline:none}.proposal-field input:focus,.proposal-field select:focus{border-color:#7290b3;box-shadow:0 0 0 3px rgba(36,70,127,.08)}.proposal-security{margin-top:20px;padding:18px;border:1px solid #dce5ef;border-radius:12px;background:#f8fafc}.proposal-security strong{display:block;margin-bottom:4px}.proposal-security p{margin:0 0 12px;color:#667d96;font-size:12px;line-height:1.55}.proposal-form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.proposal-note{margin-top:18px;padding:13px 14px;border-radius:9px;background:#eef5ff;color:#1d4f87;font-size:13px;line-height:1.55}.proposal-note.error{background:#fff1ef;color:var(--red)}.proposal-note.success{background:#eff9f2;color:var(--green)}.proposal-closed{padding:32px;text-align:center}.proposal-closed h2{margin:0 0 8px}.proposal-closed p{margin:0;color:var(--muted);line-height:1.65}.proposal-success{padding:38px 30px;text-align:center}.proposal-success img{max-width:360px;width:80%;margin-bottom:24px}.proposal-success h1{font-size:34px;margin:0 0 10px}.proposal-success p{max-width:640px;margin:0 auto 22px;color:var(--muted);line-height:1.7}.proposal-footer{width:min(1120px,calc(100% - 32px));margin:0 auto 34px;text-align:center;color:#7b8ea4;font-size:11px;line-height:1.6}@media print{body{background:#fff}.proposal-top-actions,.proposal-accept,.proposal-footer{display:none!important}.proposal-wrap{width:100%;margin:0}.proposal-paper{border:0;box-shadow:none;border-radius:0}.proposal-top-inner{width:100%;padding:18px 32px}.proposal-hero,.proposal-section,.proposal-company{break-inside:avoid}}@media(max-width:780px){.proposal-top-inner{align-items:flex-start;flex-direction:column}.proposal-meta{grid-template-columns:1fr 1fr}.proposal-hero,.proposal-section,.proposal-company{padding-left:24px;padding-right:24px}.proposal-grid{grid-template-columns:1fr}.proposal-field.full{grid-column:auto}.proposal-company{grid-template-columns:1fr}.proposal-pricing{display:block;overflow-x:auto;white-space:nowrap}}@media(max-width:520px){.proposal-meta{grid-template-columns:1fr}.proposal-wrap{width:min(100% - 20px,1120px);margin-top:18px}.proposal-hero,.proposal-section,.proposal-company{padding-left:19px;padding-right:19px}.proposal-form{padding:22px 18px}.proposal-accept-head{padding:22px 18px}}

/* Public proposal view layout refinements */
.proposal-top-inner{width:min(1080px,calc(100% - 40px));padding:24px 0}
.proposal-wrap{width:min(1080px,calc(100% - 40px));margin:32px auto 64px}
.proposal-paper{border-radius:16px}
.proposal-hero{padding:44px 46px 32px}
.proposal-hero h1{max-width:900px;margin:10px 0 14px;font-size:clamp(34px,4.2vw,54px);line-height:1.03;letter-spacing:-.025em}
.proposal-hero>p{max-width:900px;font-size:15px;line-height:1.65}
.proposal-meta{grid-template-columns:1.35fr 1fr 1fr 1fr;gap:14px;margin-top:30px}
.proposal-meta-card{min-height:118px;padding:18px 16px 17px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.proposal-meta-card small{margin:0 0 10px;font-size:10px;line-height:1.2}
.proposal-meta-card strong{margin:0;font-size:14px;line-height:1.35}
.proposal-meta-card span{margin-top:6px;font-size:12px;line-height:1.4}
.proposal-section{padding:34px 46px}
.proposal-section:first-of-type{padding-top:38px}
.proposal-section h2{margin:0 0 14px;font-size:24px;line-height:1.2}
.proposal-section p{font-size:15px;line-height:1.8}
.proposal-company{padding:30px 46px}
@media(max-width:900px){
  .proposal-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .proposal-meta-card{min-height:110px}
}
@media(max-width:640px){
  .proposal-top-inner,.proposal-wrap{width:min(100% - 24px,1080px)}
  .proposal-hero{padding:30px 22px 24px}
  .proposal-hero h1{font-size:clamp(30px,9vw,42px)}
  .proposal-meta{grid-template-columns:1fr;gap:10px}
  .proposal-meta-card{min-height:auto}
  .proposal-section,.proposal-company{padding-left:22px;padding-right:22px}
}

<body>
<main id="proposalApp"><div class="proposal-loading">Loading proposal…</div></main>
<noscript><div style="max-width:900px;margin:60px auto;padding:28px;background:#fff;border:1px solid #dce5ef;border-radius:14px;font-family:Arial,sans-serif;color:#17365f"><h2>JavaScript is required</h2><p>Please enable JavaScript to view this proposal.</p></div></noscript>
<script>window.addEventListener('error',function(e){var a=document.getElementById('proposalApp');if(a&&!a.dataset.rendered){a.innerHTML='<div style="max-width:900px;margin:60px auto;padding:28px;background:#fff;border:1px solid #dce5ef;border-radius:14px;font-family:Arial,sans-serif;color:#17365f"><h2 style="margin-top:0">Proposal could not load</h2><p>Please refresh the page. If the problem continues, contact Workforce NON-DOT at 773-245-7009.</p></div>';}});
(()=>{
'use strict';
const API='https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/nondot-proposal-public';
const KEY='sb_publishable_xVI6Mjkk1bNVMGHZCPuK6w_8FSHKdkC';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),qs=new URLSearchParams(location.search),id=qs.get('id')||'',token=qs.get('token')||'';
let state=null,turnToken='',widget=null;
async function call(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,id,token,...payload})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to load proposal.');return d}
function note(m,type=''){const n=$('#proposalNotice');if(!n)return;n.className='proposal-note '+type;n.textContent=m;n.hidden=!m}
function closed(p,c){const msg=p.status==='accepted'?'This proposal has already been approved.':p.status==='declined'?'This proposal has been declined.':p.status==='expired'?'This proposal has expired.':'This proposal is no longer available.';return `<div class="proposal-accept"><div class="proposal-closed"><h2>${esc(msg)}</h2><p>Proposal ${esc(p.proposal_number)} · ${esc(c.name)}</p></div></div>`}
function pricing(d){const p=d.proposal,rows=(d.items||[]).filter(x=>x.selected!==false);if(!rows.length)return '';return `<section class="proposal-section"><h2>Pricing & Scope</h2><table class="proposal-pricing"><thead><tr><th>Item</th><th>Billing</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong>${x.description?`<small>${esc(x.description)}</small>`:''}</td><td>${x.billing_type==='recurring'?'Recurring'+(x.billing_interval?' / '+esc(x.billing_interval):''):'One-time'}</td><td>${Number(x.quantity||1)}</td><td>${money(Number(x.quantity||0)*Number(x.unit_price||0))}</td></tr>`).join('')}</tbody></table><div class="proposal-totals">${Number(p.discount_amount||0)>0?`<span>Subtotal</span><strong>${money(p.subtotal)}</strong><span>Discount</span><strong>− ${money(p.discount_amount)}</strong>`:''}<span class="grand">Total Proposal Value</span><strong class="grand">${money(p.total_amount)}</strong>${Number(p.recurring_amount||0)>0?`<span>Recurring</span><strong>${money(p.recurring_amount)}/mo</strong>`:''}</div></section>`}
function approval(d){const p=d.proposal;if(['accepted','declined','expired','archived'].includes(String(p.status)))return closed(p,d.company);return `<section class="proposal-accept" id="approval"><div class="proposal-accept-head"><span>Proposal Approval</span><h2>Approve and create your Workforce NON-DOT account</h2><p>Confirm your contact and company information below. Approval creates your secure account and sends your setup email.</p></div><form class="proposal-form" id="approvalForm" novalidate><div class="proposal-grid"><label class="proposal-field"><span>First Name *</span><input name="first_name" value="${esc(p.recipient_first_name||'')}" required></label><label class="proposal-field"><span>Last Name *</span><input name="last_name" value="${esc(p.recipient_last_name||'')}" required></label><label class="proposal-field full"><span>Company Legal Name *</span><input name="company_name" value="${esc(p.recipient_company||'')}" required></label><label class="proposal-field"><span>DBA Name</span><input name="dba_name"></label><label class="proposal-field"><span>Business Type</span><input name="business_type" placeholder="Corporation, LLC, partnership, etc."></label><label class="proposal-field"><span>Email</span><input value="${esc(p.recipient_email||'')}" readonly></label><label class="proposal-field"><span>Phone</span><input name="phone" value="${esc(p.recipient_phone||'')}"></label><label class="proposal-field full"><span>Street Address *</span><input name="address_line1" required></label><label class="proposal-field full"><span>Address Line 2</span><input name="address_line2"></label><label class="proposal-field"><span>City *</span><input name="city" required></label><label class="proposal-field"><span>State *</span><input name="state" required maxlength="50"></label><label class="proposal-field"><span>ZIP / Postal Code *</span><input name="postal_code" required></label><label class="proposal-field"><span>Country</span><input name="country" value="US"></label></div><div class="proposal-security"><strong>Security verification</strong><p>Complete the Cloudflare check before approving this proposal.</p><div id="proposalTurnstile"></div></div><div class="proposal-form-actions"><button class="proposal-btn orange" type="submit" id="approveBtn" disabled>Approve Proposal</button><button class="proposal-btn" type="button" id="declineBtn" disabled>Decline Proposal</button></div><div id="proposalNotice" class="proposal-note" hidden></div></form></section>`}
function render(d){state=d;document.getElementById('proposalApp').dataset.rendered='1';const p=d.proposal,c=d.company,prospect=p.recipient_company||[p.recipient_first_name,p.recipient_last_name].filter(Boolean).join(' ')||'Prospect';document.title=`${p.proposal_number} | Workforce NON-DOT Proposal`;$('#proposalApp').innerHTML=`<div class="proposal-shell"><header class="proposal-top"><div class="proposal-top-inner"><img src="${esc(c.white_logo)}" alt="${esc(c.name)}"><div class="proposal-top-actions"><button class="proposal-btn ghost" type="button" id="printProposal">Print / Save PDF</button></div></div></header><div class="proposal-wrap"><article class="proposal-paper"><section class="proposal-hero"><span class="proposal-kicker">${esc(p.proposal_number)}</span><h1>${esc(p.title)}</h1><p>${esc(p.subtitle||'A Workforce NON-DOT solution prepared for your organization.')}</p><div class="proposal-meta"><div class="proposal-meta-card"><small>Prepared For</small><strong>${esc(prospect)}</strong><span>${esc(p.recipient_email)}</span></div><div class="proposal-meta-card"><small>Prepared By</small><strong>${esc(c.name)}</strong><span>${esc(c.phone)}</span></div><div class="proposal-meta-card"><small>Valid Through</small><strong>${esc(p.valid_until||'—')}</strong></div><div class="proposal-meta-card"><small>Status</small><strong>${esc(String(p.status||'draft').toUpperCase())}</strong></div></div></section>${(p.sections||[]).map(s=>`<section class="proposal-section"><h2>${esc(s.title||'')}</h2><p>${esc(s.body||'')}</p></section>`).join('')}${pricing(d)}${p.terms_text?`<section class="proposal-section"><h2>Terms</h2><p>${esc(p.terms_text)}</p></section>`:''}<footer class="proposal-company"><p><strong>${esc(c.name)}</strong>${esc(c.address1)}<br>${esc(c.city)}, ${esc(c.state)} ${esc(c.postal_code)}<br>${esc(c.phone)} · ${esc((c.website_display||c.website.replace('https://','')))}</p><span class="proposal-kicker">Workforce NON-DOT</span></footer></article>${approval(d)}</div><footer class="proposal-footer">This proposal is intended for the recipient shown above. Approval records the proposal response and creates the applicable Workforce NON-DOT account.</footer></div>`;$('#printProposal').onclick=()=>window.print();if($('#approvalForm')){mountTurnstile(d.turnstile_site_key);$('#approvalForm').addEventListener('submit',approve);$('#declineBtn').onclick=decline}}
function mountTurnstile(siteKey){function mount(){if(!window.turnstile){setTimeout(mount,80);return}if(widget!==null)return;widget=window.turnstile.render('#proposalTurnstile',{sitekey:siteKey,action:'nondot_proposal_response',theme:'auto',size:'flexible',callback:t=>{turnToken=String(t||'');turnTokenAt=Date.now();$('#approveBtn').disabled=!turnToken;$('#declineBtn').disabled=!turnToken;note('Security check complete.','success')},'expired-callback':()=>{turnToken='';turnTokenAt=0;$('#approveBtn').disabled=true;$('#declineBtn').disabled=true;note('Security check expired. A new check is loading…','error');try{window.turnstile.reset(widget)}catch{}},'timeout-callback':()=>{turnToken='';turnTokenAt=0;$('#approveBtn').disabled=true;$('#declineBtn').disabled=true;note('Security check timed out. A new check is loading…','error');try{window.turnstile.reset(widget)}catch{}},'error-callback':()=>{turnToken='';turnTokenAt=0;$('#approveBtn').disabled=true;$('#declineBtn').disabled=true;note('Security verification could not load. Refresh the page and try again.','error');return true}})}mount()}
function formData(){const f=new FormData($('#approvalForm'));return Object.fromEntries(f.entries())}
async function approve(e){e.preventDefault();const b=$('#approveBtn');if(!turnToken||!turnTokenAt||Date.now()-turnTokenAt>240000){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note('Security check expired. Complete the refreshed check and try again.','error');b.disabled=true;const d=$('#declineBtn');if(d)d.disabled=true;return}b.disabled=true;note('Creating your Workforce NON-DOT account…');try{const x=formData();for(const k of ['first_name','last_name','company_name','address_line1','city','state','postal_code'])if(!String(x[k]||'').trim())throw new Error('Complete all required company and contact fields.');const r=await call('accept',{turnstile_token:turnToken,acceptance:x});if(r&&r.ok===false&&r.code==='TURNSTILE_RETRY'){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note(r.error||'Security check expired. Complete it again.','error');b.disabled=true;const d=$('#declineBtn');if(d)d.disabled=true;return}success(r)}catch(e){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note((e.message||'Approval failed.')+' Complete the refreshed security check and try again.','error');b.disabled=true;const d=$('#declineBtn');if(d)d.disabled=true}}
async function decline(){const b=$('#declineBtn');if(!turnToken||!turnTokenAt||Date.now()-turnTokenAt>240000){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note('Security check expired. Complete the refreshed check and try again.','error');b.disabled=true;const a=$('#approveBtn');if(a)a.disabled=true;return}b.disabled=true;note('Recording your response…');try{const r=await call('decline',{turnstile_token:turnToken});if(r&&r.ok===false&&r.code==='TURNSTILE_RETRY'){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note(r.error||'Security check expired. Complete it again.','error');b.disabled=true;const a=$('#approveBtn');if(a)a.disabled=true;return}state.proposal=r.proposal;render(state)}catch(e){turnToken='';turnTokenAt=0;try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch{};note((e.message||'Unable to record response.')+' Complete the refreshed security check and try again.','error');b.disabled=true;const a=$('#approveBtn');if(a)a.disabled=true}}
function success(r){const c=state.company,p=r.proposal;$('#proposalApp').innerHTML=`<div class="proposal-shell"><header class="proposal-top"><div class="proposal-top-inner"><img src="${esc(c.white_logo)}" alt="${esc(c.name)}"></div></header><div class="proposal-wrap"><div class="proposal-paper proposal-success"><img src="${esc(c.regular_logo)}" alt="${esc(c.name)}"><h1>Proposal approved</h1><p>Thank you, ${esc(p.accepted_first_name||'')}. Your Workforce NON-DOT account has been created and a branded account setup email has been sent to <strong>${esc(p.recipient_email)}</strong>.</p><a class="proposal-btn orange" href="${esc(r.portal_url||c.website)}">Open Your Portal</a></div></div></div>`}
(async()=>{try{if(!id||!token)throw new Error('This proposal link is incomplete.');render(await call('get'))}catch(e){$('#proposalApp').innerHTML=`<div class="proposal-wrap"><div class="proposal-paper proposal-closed"><h2>Proposal unavailable</h2><p>${esc(e.message)}</p></div></div>`}})();
})();
</script>
<script>setTimeout(function(){var a=document.getElementById('proposalApp');if(a&&!a.dataset.rendered&&/Loading proposal/.test(a.textContent||'')){a.innerHTML='<div style="max-width:900px;margin:60px auto;padding:28px;background:#fff;border:1px solid #dce5ef;border-radius:14px;font-family:Arial,sans-serif;color:#17365f"><h2 style="margin-top:0">Proposal is taking too long to load</h2><p>Refresh the page. If the problem continues, contact Workforce NON-DOT at 773-245-7009.</p></div>';}},12000);</script>
